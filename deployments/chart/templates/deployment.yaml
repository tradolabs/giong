apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: giong
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          {{- if .Values.dind.enabled }}
          env:
            - name: DOCKER_HOST
              value: unix:///run/docker/docker.sock
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "chart.fullname" . }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/.giong
            {{- if .Values.dind.enabled }}
            - name: docker-sock
              mountPath: /run/docker
            {{- end }}
        {{- if .Values.dind.enabled }}
        - name: dind
          image: {{ .Values.dind.image }}
          args:
            - --host=unix:///run/docker/docker.sock
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
            - name: data
              mountPath: /var/lib/docker/image
              subPath: dind/image
            - name: data
              mountPath: /var/lib/docker/overlay2
              subPath: dind/overlay2
            - name: data
              mountPath: /data/.giong/workspaces
              subPath: workspaces
            - name: docker-sock
              mountPath: /run/docker
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "chart.fullname" . }}-data
        {{- if .Values.dind.enabled }}
        - name: docker-storage
          emptyDir: {}
        - name: docker-sock
          emptyDir: {}
        {{- end }}
