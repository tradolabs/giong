name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*"

concurrency:
  group: publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/giong
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set build targets and plugin image references
        id: targets
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
            printf 'GIONG_PLUGIN_IMAGE_PREFIX=%s/%s/plugins/\n' "$REGISTRY" "$repository" >> "$GITHUB_ENV"
            printf 'GIONG_PLUGIN_IMAGE_TAG=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            printf 'targets<<EOF\ngiong\nplugins\nEOF\n' >> "$GITHUB_OUTPUT"
          else
            printf 'targets=giong\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push images
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ steps.targets.outputs.targets }}
          push: true
          set: |
            *.cache-from=type=gha,scope=giong
            giong.cache-to=type=gha,mode=max,scope=giong
