[package]
name = "giong-controller"
version = "0.1.0"
edition = "2024"
description = "Foreground controller for Giong"

[dependencies]
giong-node = { path = "../../packages/node", default-features = false }
anyhow.workspace = true
giong-database = { path = "../../packages/database" }
giong-core = { path = "../../packages/core" }
uuid = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
dotenvy = "0.15.7"
serde.workspace = true
thiserror.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
serde_json.workspace = true
