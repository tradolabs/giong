[package]
name = "giong-core"
version = "0.1.0"
edition = "2024"
description = "A small Git-polling CI/CD runner"

[dependencies]
giong-di = { path = "../di" }
giong-database = { path = "../database" }
giong-git = { path = "../git" }
giong-storage = { path = "../storage" }
giong-publisher = { path = "../publisher" }
giong-runner = { path = "../runner" }
tokio = { workspace = true, features = ["fs", "sync"] }
anyhow.workspace = true
async-trait.workspace = true
uuid = { workspace = true, features = ["serde"] }
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64 = "0.23.1"
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
serde.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror.workspace = true
getrandom = "0.4"
