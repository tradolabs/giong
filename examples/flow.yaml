flow:
  name: personal
  inherited_vault_ids: []
  nodes:
    - name: repository
      type: repository
      properties:
        repo_url: https://github.com/trado/gitops
        token:
          secret:
            key: git_token
      triggers:
        - type: interval
          seconds: 60

    - name: deploy
      type: kubectl
      properties:
        source: repository
        path: deployments/trado
        values_file: environments/values.yaml
        namespace: trado
        kubeconfig:
          secret:
            key: kubeconfig
            # Omit vault for the flow vault; otherwise use an attached vault's name.
            # vault: kubernetes
      triggers:
        - type: event
          node: repository
