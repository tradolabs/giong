[package]
name = "giong-core"
version = "0.1.0"
edition = "2024"
description = "A small Git-polling CI/CD runner"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
giong-database = { path = "../database" }
giong-git = { path = "../git" }
include_dir = "0.7.4"
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { workspace = true, features = ["sync"] }
giong-storage = { path = "../storage" }
