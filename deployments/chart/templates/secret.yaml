{{- $name := include "chart.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $encKey := randBytes 32 | b64enc }}
{{- $jwtSecret := randAlphaNum 32 | b64enc }}
{{- if and $existing $existing.data }}
  {{- if hasKey $existing.data "GIONG_ENCRYPTION_KEY" }}
    {{- $encKey = index $existing.data "GIONG_ENCRYPTION_KEY" }}
  {{- end }}
  {{- if hasKey $existing.data "GIONG_JWT_SECRET" }}
    {{- $jwtSecret = index $existing.data "GIONG_JWT_SECRET" }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  GIONG_ENCRYPTION_KEY: {{ $encKey }}
  GIONG_JWT_SECRET: {{ $jwtSecret }}
