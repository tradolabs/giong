apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
    spec:
      containers:
        - name: giong
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          {{- if .Values.dind.enabled }}
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "chart.fullname" . }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/.giong
        {{- if .Values.dind.enabled }}
        - name: dind
          image: {{ .Values.dind.image }}
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "chart.fullname" . }}-data
        {{- if .Values.dind.enabled }}
        - name: docker-storage
          emptyDir: {}
        {{- end }}
