flow:
  name: personal
  vaults:
    - git-credentials
    - kubernetes
  nodes:
    - name: repository
      type: repository
      properties:
        repo_url: https://github.com/trado/gitops
        token:
          secret:
            key: git_token
            vault: git-credentials
      triggers:
        - type: interval
          seconds: 60

    - name: deploy
      type: kubectl
      properties:
        source: repository
        path: deployments/trado
        values_file: environments/values.yaml
        namespace: trado
        kubeconfig:
          secret:
            key: kubeconfig
            vault: kubernetes
      triggers:
        - type: event
          node: repository
