[package]
name = "giong-provider"
version.workspace = true
edition = "2024"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
wasmtime = { version = "50", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
